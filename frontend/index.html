<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Preconnect to external origins for faster resource loading -->
    <link rel="preconnect" href="https://res.cloudinary.com" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Viewport & theme -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020817" />
    <meta name="color-scheme" content="dark" />

    <!-- SEO -->
    <title>SpotFound — Lost and Found</title>
    <meta name="description" content="SpotFound — Report, track, and claim lost items on campus. AI-powered matching, real-time notifications, and indoor map support." />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (social sharing) -->
    <meta property="og:title" content="SpotFound — Lost and Found" />
    <meta property="og:description" content="Campus Lost & Found platform with AI-powered item matching and real-time tracking." />
    <meta property="og:type" content="website" />

  </head>

  <body>
    <!-- Fallback badge for static crawlers and backlink indexers -->
    <div id="dealmyapp-badge" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">
      <a href="https://dealmyapp.com/listings/spotfound"><img src="https://dealmyapp.com/badges/listed-on-dealmyapp-light.svg" alt="Listed on DealMyApp" width="200" height="40"></a>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
